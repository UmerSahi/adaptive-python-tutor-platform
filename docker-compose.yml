services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1

  dashboard:
    build: .
    command: streamlit run app/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    depends_on:
      - api

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    network_mode: "none"
    cpus: "0.5"
    mem_limit: "128m"
    pids_limit: 32
    read_only: true
